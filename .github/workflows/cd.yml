name: CD

# se lance seulement quand la CI est verte sur main
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  images:
    name: Images Docker
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, client]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ghcr.io/inosthful/kickstore-${{ matrix.app }}:latest
            ghcr.io/inosthful/kickstore-${{ matrix.app }}:${{ github.event.workflow_run.head_sha }}
          labels: org.opencontainers.image.source=https://github.com/Inosthful/kickstore
