openapi: 3.1.0
info:
  title: KickStore API
  version: 1.0.0
  description: |
    Accord entre le Front (Vue) et le Back (Express).
    Deux routes essentielles : le stock par pointure et la commande.
    Montants en centimes. Toute erreur renvoie `{ code, message }`.
    Les remises (code promo) sont toujours calculées par le serveur.

    Les exemples servent aussi au mock Prism utilisé par le Front (`npm run mock`).
servers:
  - url: http://localhost:3000
security: []

tags:
  - name: Stock
    description: Essentiel - quelles pointures sont disponibles ?
  - name: Commande
    description: Essentiel - valider la commande et décrémenter le stock
  - name: Panier
    description: Support - revalider le panier stocké dans le navigateur
  - name: Catalogue
    description: Support - afficher les produits

paths:
  /api/products/{id}/stock:
    get:
      tags: [Stock]
      summary: Stock par pointure
      description: Une pointure à stock 0 est grisée côté Front.
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Pointures et stock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockResponse'
              example:
                sizes:
                  - { size: 40, stock: 2 }
                  - { size: 41, stock: 0 }
                  - { size: 42, stock: 3 }
                  - { size: 42.5, stock: 1 }
                  - { size: 43, stock: 4 }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/orders:
    post:
      tags: [Commande]
      summary: Valider une commande
      description: |
        Le stock est re-vérifié puis décrémenté dans une seule transaction.
        Si une paire manque, rien n'est enregistré.
        Un code promo invalide ou expiré renvoie une 400 sur `promoCode`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
      responses:
        '201':
          description: Commande créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              examples:
                sans-code:
                  value:
                    id: 12
                    status: confirmed
                    subtotal: 12900
                    discount: 0
                    total: 12900
                    customer: { firstName: Ada, lastName: Lovelace, email: ada@example.com }
                    address: { street: 1 rue des Sneakers, postalCode: '75011', city: Paris }
                    items:
                      - { productId: 1, name: Nike Dunk Low Panda, size: 42, quantity: 1, unitPrice: 12900, lineTotal: 12900 }
                    createdAt: '2026-10-29T10:00:00.000Z'
                code-promo:
                  value:
                    id: 13
                    status: confirmed
                    subtotal: 12900
                    discount: 1290
                    total: 11610
                    promoCode: KICK10
                    customer: { firstName: Ada, lastName: Lovelace, email: ada@example.com }
                    address: { street: 1 rue des Sneakers, postalCode: '75011', city: Paris }
                    items:
                      - { productId: 1, name: Nike Dunk Low Panda, size: 42, quantity: 1, unitPrice: 12900, lineTotal: 12900 }
                    createdAt: '2026-10-29T10:00:00.000Z'
        '400':
          description: Données invalides, `issues` indique les champs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: VALIDATION_ERROR
                message: Données invalides
                issues:
                  - { path: address.postalCode, message: Code postal invalide }
        '409':
          description: Rupture de stock, `conflicts` indique les paires concernées
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: OUT_OF_STOCK
                message: Stock insuffisant pour au moins un article
                conflicts:
                  - { productId: 1, size: 42, requested: 1, available: 0 }

  /api/cart/validate:
    post:
      tags: [Panier]
      summary: Revalider un panier
      description: |
        Le serveur recalcule les prix, vérifie le stock de chaque ligne et applique le code promo.
        Un code refusé ne bloque pas le panier : la réponse reste 200 et `promo.status` l'indique.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartRequest'
      responses:
        '200':
          description: Panier recalculé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartValidation'
              examples:
                sans-code:
                  value:
                    items:
                      - { productId: 1, size: 42, quantity: 1, name: Nike Dunk Low Panda, unitPrice: 12900, lineTotal: 12900, stock: 3, status: ok }
                    subtotal: 12900
                    discount: 0
                    total: 12900
                    valid: true
                code-promo:
                  value:
                    items:
                      - { productId: 1, size: 42, quantity: 1, name: Nike Dunk Low Panda, unitPrice: 12900, lineTotal: 12900, stock: 3, status: ok }
                    subtotal: 12900
                    discount: 1290
                    total: 11610
                    valid: true
                    promo: { code: KICK10, status: applied, percent: 10 }
        '400':
          description: Données invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/products:
    get:
      tags: [Catalogue]
      summary: Liste des produits
      responses:
        '200':
          description: Catalogue
          content:
            application/json:
              schema:
                type: object
                required: [products]
                properties:
                  products:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
              example:
                products:
                  - { id: 1, name: Dunk Low, brand: Nike, colorway: Panda, color: '#1b1b1b', price: 12900 }
                  - { id: 2, name: 1 High, brand: Jordan, colorway: Chicago, color: '#c8102e', price: 18900 }
                  - { id: 3, name: Samba OG, brand: Adidas, colorway: Cloud White, color: '#e9e4d8', price: 11000 }

  /api/products/{id}:
    get:
      tags: [Catalogue]
      summary: Détail d'un produit
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Le produit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
              example: { id: 1, name: Dunk Low, brand: Nike, colorway: Panda, color: '#1b1b1b', price: 12900 }
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    ProductId:
      name: id
      in: path
      required: true
      schema:
        type: integer

  responses:
    NotFound:
      description: Produit introuvable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: VALIDATION_ERROR, NOT_FOUND, OUT_OF_STOCK ou INTERNAL_ERROR
        message:
          type: string
        issues:
          type: array
          description: Présent sur un 400
          items:
            type: object
            required: [path, message]
            properties:
              path: { type: string, example: customer.email }
              message: { type: string }
        conflicts:
          type: array
          description: Présent sur un 409
          items:
            $ref: '#/components/schemas/StockConflict'

    StockConflict:
      type: object
      required: [productId, size, requested, available]
      properties:
        productId: { type: integer }
        size: { type: number }
        requested: { type: integer }
        available: { type: integer }

    Product:
      type: object
      required: [id, name, brand, colorway, color, price]
      properties:
        id: { type: integer }
        name: { type: string }
        brand: { type: string }
        colorway: { type: string }
        color: { type: string, description: Couleur hex pour l'illustration }
        price: { type: integer, description: Prix en centimes }

    StockResponse:
      type: object
      required: [sizes]
      properties:
        sizes:
          type: array
          items:
            $ref: '#/components/schemas/StockSize'

    StockSize:
      type: object
      required: [size, stock]
      properties:
        size: { type: number, example: 42 }
        stock: { type: integer, example: 3 }

    CartLineInput:
      type: object
      required: [productId, size, quantity]
      properties:
        productId: { type: integer }
        size: { type: number }
        quantity: { type: integer, minimum: 1, maximum: 5 }

    CartRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/CartLineInput'
        promoCode:
          $ref: '#/components/schemas/PromoCodeInput'

    PromoCodeInput:
      type: string
      minLength: 1
      maxLength: 20
      description: Insensible à la casse
      example: KICK10

    Promo:
      type: object
      required: [code, status]
      properties:
        code: { type: string }
        status:
          type: string
          enum: [applied, invalid, expired]
        percent:
          type: integer
          description: Présent si le code est appliqué

    CartLine:
      type: object
      required: [productId, size, quantity, name, unitPrice, lineTotal, stock, status]
      properties:
        productId: { type: integer }
        size: { type: number }
        quantity: { type: integer }
        name: { type: string }
        unitPrice: { type: integer }
        lineTotal: { type: integer }
        stock: { type: integer }
        status:
          type: string
          enum: [ok, insufficient_stock, unavailable]

    CartValidation:
      type: object
      required: [items, subtotal, discount, total, valid]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartLine'
        subtotal: { type: integer, description: Avant remise }
        discount: { type: integer, description: 0 sans code appliqué }
        total: { type: integer, description: subtotal - discount }
        valid: { type: boolean }
        promo:
          $ref: '#/components/schemas/Promo'

    Customer:
      type: object
      required: [firstName, lastName, email]
      properties:
        firstName: { type: string, minLength: 1 }
        lastName: { type: string, minLength: 1 }
        email: { type: string, format: email }

    Address:
      type: object
      required: [street, postalCode, city]
      properties:
        street: { type: string, minLength: 1 }
        postalCode: { type: string, pattern: '^\d{5}$', example: '75011' }
        city: { type: string, minLength: 1 }

    OrderRequest:
      type: object
      required: [customer, address, items]
      properties:
        customer:
          $ref: '#/components/schemas/Customer'
        address:
          $ref: '#/components/schemas/Address'
        items:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/CartLineInput'
        promoCode:
          $ref: '#/components/schemas/PromoCodeInput'

    OrderItem:
      type: object
      required: [productId, name, size, quantity, unitPrice, lineTotal]
      properties:
        productId: { type: integer }
        name: { type: string }
        size: { type: number }
        quantity: { type: integer }
        unitPrice: { type: integer }
        lineTotal: { type: integer }

    Order:
      type: object
      required: [id, status, subtotal, discount, total, customer, address, items, createdAt]
      properties:
        id: { type: integer }
        status: { type: string, enum: [confirmed] }
        subtotal: { type: integer }
        discount: { type: integer }
        total: { type: integer }
        promoCode: { type: string }
        customer:
          $ref: '#/components/schemas/Customer'
        address:
          $ref: '#/components/schemas/Address'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        createdAt: { type: string, format: date-time }
